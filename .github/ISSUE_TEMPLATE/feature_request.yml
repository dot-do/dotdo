name: Feature Request
description: Suggest a new feature or enhancement for dotdo
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out this form to help us understand your request.

        **Note:** For open-ended ideas or brainstorming, consider using [GitHub Discussions](https://github.com/dot-do/dotdo/discussions) instead.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A clear and concise description of the feature you're requesting.
      placeholder: Briefly describe the feature...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What motivated this request?
      placeholder: |
        I'm trying to...
        Currently, I have to...
        This is frustrating because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: |
        Describe your proposed solution in detail:
        - How would the API look?
        - How would developers use it?
        - What would the expected behavior be?
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: API Design (if applicable)
      description: If you have ideas about the API, share them here
      render: typescript
      placeholder: |
        // Example API usage
        import { DO } from 'dotdo'

        export class MyDO extends DO {
          async myNewFeature() {
            // How would this work?
          }
        }

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions have you considered?
      placeholder: |
        - Alternative 1: ...
        - Alternative 2: ...
        - Why the proposed solution is better: ...

  - type: dropdown
    id: package
    attributes:
      label: Target Package(s)
      description: Which package(s) should this feature be added to?
      multiple: true
      options:
        - "dotdo (main package)"
        - "@dotdo/do"
        - "@dotdo/db"
        - "@dotdo/rpc"
        - "@dotdo/mcp"
        - "@dotdo/ai"
        - "@dotdo/auth"
        - "@dotdo/api"
        - "fsx (filesystem)"
        - "gitx (git)"
        - "bashx (shell)"
        - "CLI"
        - "New Package"
        - "Not sure / Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (from your perspective)
      description: How important is this feature for your use case?
      options:
        - "Critical - Blocking my adoption of dotdo"
        - "High - Would significantly improve my workflow"
        - "Medium - Nice to have"
        - "Low - Minor improvement"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references that would help us understand the request
      placeholder: |
        - Links to similar features in other projects
        - Screenshots or diagrams
        - Related issues or discussions

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature
        - label: I would be willing to help test this feature
        - label: I would be willing to help document this feature

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions for similar requests
          required: true
        - label: This feature aligns with dotdo's scope (runtime/framework, not platform/product)
          required: true
