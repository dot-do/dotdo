name: Bug Report
description: Report a bug or unexpected behavior in dotdo
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
      placeholder: |
        1. Create a DO with...
        2. Call the method...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: A clear description of what actually happened.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: If applicable, provide a minimal code sample that reproduces the issue
      render: typescript
      placeholder: |
        import { DO } from 'dotdo'

        export class MyDO extends DO {
          // Your code here
        }

  - type: textarea
    id: error
    attributes:
      label: Error Output
      description: If applicable, paste any error messages or stack traces
      render: shell
      placeholder: |
        Error: Something went wrong
            at Object.<anonymous> (/path/to/file.ts:10:5)
            ...

  - type: dropdown
    id: package
    attributes:
      label: Affected Package(s)
      description: Which package(s) is this bug related to?
      multiple: true
      options:
        - "dotdo (main package)"
        - "@dotdo/do"
        - "@dotdo/db"
        - "@dotdo/rpc"
        - "@dotdo/mcp"
        - "@dotdo/ai"
        - "@dotdo/auth"
        - "@dotdo/api"
        - "fsx (filesystem)"
        - "gitx (git)"
        - "bashx (shell)"
        - "CLI"
        - "Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: dotdo Version
      description: What version of dotdo are you using?
      placeholder: "e.g., 3.0.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      placeholder: |
        - Node.js version:
        - Wrangler version:
        - OS:
        - Runtime (local/deployed):
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug for your use case?
      options:
        - "Critical - Blocks development/production"
        - "High - Major feature broken"
        - "Medium - Feature partially broken"
        - "Low - Minor issue, workaround exists"
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Have you found a workaround? If so, please share it.
      placeholder: Describe any workaround you've found...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have tested with the latest version of dotdo
          required: true
        - label: I can provide a minimal reproduction repository if needed
