# E2E Staging Workflow
# Deploy to staging and run E2E tests against deployed worker
#
# This workflow:
# - Deploys the worker to staging environment
# - Runs E2E tests against the deployed worker
# - Reports deployment and test status
#
# Required Secrets:
# - CLOUDFLARE_API_TOKEN: Cloudflare API token with Worker deployment permissions
# - CLOUDFLARE_ACCOUNT_ID: Cloudflare account ID

name: E2E Staging

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'packages/chdb-wasm/**'
      - '.github/workflows/e2e-staging.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/chdb-wasm/**'
      - '.github/workflows/e2e-staging.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (use existing staging worker)'
        required: false
        default: 'false'
        type: boolean
      worker_url:
        description: 'Custom worker URL (optional, overrides default staging URL)'
        required: false
        type: string

# Cancel in-progress runs for the same branch
concurrency:
  group: e2e-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  # Default staging worker URL - update this after first deployment
  STAGING_WORKER_URL: 'https://chdb-wasm-staging.clickhouse.workers.dev'

jobs:
  # ============================================================================
  # Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Skip if explicitly requested or if running on PRs from forks (no secrets)
    if: |
      github.event.inputs.skip_deploy != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/chdb-wasm

      - name: Deploy to staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to staging environment..."

          # Deploy to staging
          DEPLOY_OUTPUT=$(pnpm deploy:staging 2>&1) || {
            echo "::error::Deployment failed"
            echo "$DEPLOY_OUTPUT"
            exit 1
          }

          echo "$DEPLOY_OUTPUT"

          # Extract worker URL from deployment output
          WORKER_URL="${{ env.STAGING_WORKER_URL }}"

          # Use custom URL if provided
          if [ -n "${{ github.event.inputs.worker_url }}" ]; then
            WORKER_URL="${{ github.event.inputs.worker_url }}"
          fi

          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "deployment_id=$(date +%s)" >> $GITHUB_OUTPUT

          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Worker URL:** $WORKER_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        working-directory: packages/chdb-wasm

      - name: Wait for deployment to propagate
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 10

          # Verify deployment is accessible
          echo "Verifying deployment at ${{ steps.deploy.outputs.worker_url }}"

          for i in {1..5}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.worker_url }}/ping" || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "Deployment verified successfully!"
              exit 0
            fi
            echo "Attempt $i: Got HTTP $RESPONSE, retrying in 5s..."
            sleep 5
          done

          echo "::warning::Could not verify deployment, but continuing with tests"

  # ============================================================================
  # Smoke Tests - Quick validation immediately after deployment
  # ============================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    # Run only if deployment succeeded
    if: needs.deploy-staging.result == 'success'
    outputs:
      smoke_passed: ${{ steps.smoke.outputs.passed }}

    steps:
      - name: Determine Worker URL
        id: worker-url
        run: |
          if [ -n "${{ github.event.inputs.worker_url }}" ]; then
            WORKER_URL="${{ github.event.inputs.worker_url }}"
          elif [ -n "${{ needs.deploy-staging.outputs.worker_url }}" ]; then
            WORKER_URL="${{ needs.deploy-staging.outputs.worker_url }}"
          else
            WORKER_URL="${{ env.STAGING_WORKER_URL }}"
          fi
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "Worker URL: $WORKER_URL"

      - name: Run Smoke Tests
        id: smoke
        run: |
          WORKER_URL="${{ steps.worker-url.outputs.worker_url }}"
          PASSED=true

          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Worker URL:** $WORKER_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status | Latency |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          # Test 1: Health check - /ping endpoint
          echo "Testing /ping endpoint..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" "${WORKER_URL}/ping" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$STATUS" = "200" ] && [ "$BODY" = "Ok." ]; then
            echo "| /ping | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| /ping | :x: Fail (HTTP $STATUS) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          # Test 2: Health check - /replicas_status endpoint
          echo "Testing /replicas_status endpoint..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" "${WORKER_URL}/replicas_status" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$STATUS" = "200" ]; then
            echo "| /replicas_status | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| /replicas_status | :x: Fail (HTTP $STATUS) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          # Test 3: Simple SQL query - SELECT 1
          echo "Testing SELECT 1 query..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" "${WORKER_URL}/?query=SELECT%201%20AS%20result&default_format=JSON" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$STATUS" = "200" ]; then
            # Verify JSON response contains expected data
            if echo "$BODY" | grep -q '"result"'; then
              echo "| SELECT 1 | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| SELECT 1 | :x: Fail (invalid response) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
              PASSED=false
            fi
          else
            echo "| SELECT 1 | :x: Fail (HTTP $STATUS) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          # Test 4: Arithmetic query - SELECT 2+2
          echo "Testing SELECT 2+2 query..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" "${WORKER_URL}/?query=SELECT%202%2B2%20AS%20result&default_format=JSON" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$STATUS" = "200" ]; then
            # Verify result is 4
            if echo "$BODY" | grep -q '"result":4'; then
              echo "| SELECT 2+2 | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| SELECT 2+2 | :x: Fail (wrong result) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
              PASSED=false
            fi
          else
            echo "| SELECT 2+2 | :x: Fail (HTTP $STATUS) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          # Test 5: CORS preflight
          echo "Testing CORS preflight..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X OPTIONS \
            -H "Origin: https://example.com" \
            -H "Access-Control-Request-Method: POST" \
            "${WORKER_URL}/" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$STATUS" = "204" ] || [ "$STATUS" = "200" ]; then
            echo "| CORS Preflight | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| CORS Preflight | :x: Fail (HTTP $STATUS) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          # Test 6: POST method
          echo "Testing POST method..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: text/plain" \
            -d "SELECT 42 AS answer" \
            "${WORKER_URL}/?default_format=JSON" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$STATUS" = "200" ]; then
            if echo "$BODY" | grep -q '"answer":42'; then
              echo "| POST Query | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| POST Query | :x: Fail (wrong result) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
              PASSED=false
            fi
          else
            echo "| POST Query | :x: Fail (HTTP $STATUS) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          # Test 7: Error handling - invalid SQL
          echo "Testing error handling..."
          START=$(date +%s%N)
          RESPONSE=$(curl -s -w "\n%{http_code}" "${WORKER_URL}/?query=INVALID%20SQL%20SYNTAX" 2>/dev/null || echo -e "\n000")
          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))
          STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$STATUS" = "400" ] || [ "$STATUS" = "500" ]; then
            echo "| Error Handling | :white_check_mark: Pass | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Error Handling | :x: Fail (HTTP $STATUS, expected 4xx/5xx) | ${LATENCY}ms |" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$PASSED" = true ]; then
            echo "**Result:** :white_check_mark: All smoke tests passed" >> $GITHUB_STEP_SUMMARY
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "**Result:** :x: Some smoke tests failed" >> $GITHUB_STEP_SUMMARY
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # ============================================================================
  # E2E Tests - Deployed Worker (Full test suite)
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests]
    # Run if smoke tests passed
    if: always() && needs.smoke-tests.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/chdb-wasm

      - name: Determine Worker URL
        id: worker-url
        run: |
          # Priority: 1) Custom input, 2) Deployment output, 3) Default staging URL
          if [ -n "${{ github.event.inputs.worker_url }}" ]; then
            WORKER_URL="${{ github.event.inputs.worker_url }}"
            echo "Using custom worker URL from input"
          elif [ -n "${{ needs.deploy-staging.outputs.worker_url }}" ]; then
            WORKER_URL="${{ needs.deploy-staging.outputs.worker_url }}"
            echo "Using worker URL from deployment"
          else
            WORKER_URL="${{ env.STAGING_WORKER_URL }}"
            echo "Using default staging worker URL"
          fi

          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "Worker URL: $WORKER_URL"

      - name: Run E2E tests against deployed worker
        env:
          WORKER_URL: ${{ steps.worker-url.outputs.worker_url }}
        run: |
          echo "Running E2E tests against: $WORKER_URL"
          echo ""

          # Run the deployed worker E2E tests
          pnpm test:e2e:deployed-worker
        working-directory: packages/chdb-wasm

      - name: Generate test report
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Worker URL:** ${{ steps.worker-url.outputs.worker_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "**Status:** All E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Some E2E tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # E2E Tests - Fork PR (No Secrets)
  # ============================================================================
  e2e-tests-fork:
    name: E2E Tests (Fork PR)
    runs-on: ubuntu-latest
    # Only run for PRs from forks
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Skip notification
        run: |
          echo "## E2E Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "E2E tests against deployed workers are skipped for PRs from forks." >> $GITHUB_STEP_SUMMARY
          echo "This is because fork PRs do not have access to repository secrets." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Alternative:** A maintainer can manually trigger the E2E workflow after reviewing the PR." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Results Summary
  # ============================================================================
  results:
    name: E2E Results
    needs: [deploy-staging, smoke-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## E2E Staging Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check smoke tests first - they are the critical gate
          if [ "${{ needs.smoke-tests.result }}" = "failure" ]; then
            echo ":x: **Smoke tests FAILED - Deployment may be broken!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The basic health checks and SQL query tests failed." >> $GITHUB_STEP_SUMMARY
            echo "This indicates the deployment may not be functional." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "${{ needs.e2e-tests.result }}" = "success" ]; then
            echo ":white_check_mark: **All tests passed against staging deployment.**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" = "skipped" ]; then
            if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
              echo ":white_check_mark: **Smoke tests passed. E2E tests were skipped.**" >> $GITHUB_STEP_SUMMARY
            else
              echo ":warning: **E2E tests were skipped.**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo ":x: **E2E tests failed. Check the logs for details.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ============================================================================
  # Rollback on Smoke Test Failure
  # ============================================================================
  rollback-notification:
    name: Rollback Notification
    needs: [deploy-staging, smoke-tests]
    runs-on: ubuntu-latest
    # Run if smoke tests failed after successful deployment
    if: always() && needs.deploy-staging.result == 'success' && needs.smoke-tests.result == 'failure'

    steps:
      - name: Generate rollback notification
        run: |
          echo "## :warning: Deployment Rollback Recommended" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke tests failed after deployment!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment to staging succeeded, but the post-deployment smoke tests failed." >> $GITHUB_STEP_SUMMARY
          echo "This indicates the new deployment may not be functioning correctly." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommended Actions:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Review smoke test failures** above to understand what went wrong" >> $GITHUB_STEP_SUMMARY
          echo "2. **Rollback using Cloudflare dashboard:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Go to Workers & Pages > chdb-wasm-staging" >> $GITHUB_STEP_SUMMARY
          echo "   - Click 'Deployments' tab" >> $GITHUB_STEP_SUMMARY
          echo "   - Select previous working deployment" >> $GITHUB_STEP_SUMMARY
          echo "   - Click 'Rollback to this deployment'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **Or rollback using wrangler CLI:**" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   wrangler deployments list --env staging" >> $GITHUB_STEP_SUMMARY
          echo "   wrangler rollback --env staging" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commit Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          # Fail this job to make the overall workflow fail
          exit 1
