# Build WASM Workflow
# CI workflow to build chdb WASM on push
#
# This workflow:
# - Installs Emscripten SDK
# - Builds all optimization profiles (Debug, Release, MinSizeRel)
# - Uploads artifacts for each profile

name: Build WASM

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
    paths:
      - 'packages/chdb-wasm/**'
      - 'packages/chdb/**'
      - 'packages/clickhouse/**'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/chdb-wasm/**'
      - 'packages/chdb/**'
      - 'packages/clickhouse/**'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Debug
          - Release
          - MinSizeRel

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: '3.1.51'
  NODE_VERSION: '20'
  CMAKE_VERSION: '3.28'

jobs:
  # ============================================================================
  # Setup and Cache
  # ============================================================================
  setup:
    name: Setup Build Environment
    runs-on: ubuntu-latest
    outputs:
      emsdk_cache_hit: ${{ steps.cache-emsdk.outputs.cache-hit }}
      build_matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set build matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "all" ] || [ -z "${{ github.event.inputs.build_type }}" ]; then
            echo 'matrix=["Debug","Release","MinSizeRel"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ github.event.inputs.build_type }}"]' >> $GITHUB_OUTPUT
          fi

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}
          restore-keys: |
            emsdk-${{ env.EMSDK_VERSION }}-
            emsdk-

      - name: Install Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Verify Emscripten installation
        run: |
          source ~/emsdk/emsdk_env.sh
          emcc --version
          em++ --version

  # ============================================================================
  # Build Jobs
  # ============================================================================
  build:
    name: Build ${{ matrix.build_type }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJson(needs.setup.outputs.build_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'packages/chdb-wasm/package-lock.json'

      - name: Restore Emscripten SDK cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}
          restore-keys: |
            emsdk-${{ env.EMSDK_VERSION }}-
            emsdk-

      - name: Activate Emscripten SDK
        run: |
          cd ~/emsdk
          ./emsdk activate ${{ env.EMSDK_VERSION }}
          echo "EMSDK=$HOME/emsdk" >> $GITHUB_ENV
          echo "$HOME/emsdk" >> $GITHUB_PATH
          echo "$HOME/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "$HOME/emsdk/upstream/bin" >> $GITHUB_PATH

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            packages/chdb-wasm/build/${{ matrix.build_type }}
            !packages/chdb-wasm/build/${{ matrix.build_type }}/**/*.wasm
            !packages/chdb-wasm/build/${{ matrix.build_type }}/**/*.js
          key: cmake-build-${{ matrix.build_type }}-${{ hashFiles('packages/chdb-wasm/cmake/**', 'packages/chdb-wasm/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ matrix.build_type }}-

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Configure CMake (${{ matrix.build_type }})
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir -p packages/chdb-wasm/build/${{ matrix.build_type }}
          cd packages/chdb-wasm/build/${{ matrix.build_type }}
          emcmake cmake ../.. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCHDB_WASM_OPTIMIZATION_PROFILE=${{ matrix.build_type }} \
            -DCHDB_WASM_CLOSURE_COMPILER=${{ matrix.build_type != 'Debug' && 'ON' || 'OFF' }} \
            -DCHDB_WASM_BINARYEN_OPTS=${{ matrix.build_type != 'Debug' && 'ON' || 'OFF' }} \
            -DCHDB_WASM_NATIVE_EXCEPTIONS=${{ matrix.build_type == 'Debug' && 'OFF' || 'ON' }}

      - name: Build (${{ matrix.build_type }})
        run: |
          source ~/emsdk/emsdk_env.sh
          cd packages/chdb-wasm/build/${{ matrix.build_type }}
          emmake make -j$(nproc) VERBOSE=1

      - name: Run wasm-opt post-processing
        if: matrix.build_type != 'Debug'
        run: |
          source ~/emsdk/emsdk_env.sh
          cd packages/chdb-wasm/build/${{ matrix.build_type }}/dist

          # Find all WASM files and optimize them
          for wasm_file in *.wasm; do
            if [ -f "$wasm_file" ]; then
              echo "Optimizing $wasm_file..."
              original_size=$(stat -c%s "$wasm_file" 2>/dev/null || stat -f%z "$wasm_file")

              if [ "${{ matrix.build_type }}" = "MinSizeRel" ]; then
                wasm-opt -Oz "$wasm_file" -o "$wasm_file.opt"
              else
                wasm-opt -O3 "$wasm_file" -o "$wasm_file.opt"
              fi

              mv "$wasm_file.opt" "$wasm_file"
              optimized_size=$(stat -c%s "$wasm_file" 2>/dev/null || stat -f%z "$wasm_file")
              echo "  $wasm_file: $original_size -> $optimized_size bytes"
            fi
          done

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts/${{ matrix.build_type }}

          # Copy WASM and JS files
          cp -r packages/chdb-wasm/build/${{ matrix.build_type }}/dist/* artifacts/${{ matrix.build_type }}/ 2>/dev/null || true

          # Generate build info
          cat > artifacts/${{ matrix.build_type }}/build-info.json << EOF
          {
            "build_type": "${{ matrix.build_type }}",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "emsdk_version": "${{ env.EMSDK_VERSION }}",
            "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "runner": "${{ runner.os }}"
          }
          EOF

          # Calculate and store file sizes
          cd artifacts/${{ matrix.build_type }}
          echo "## Build Artifacts (${{ matrix.build_type }})" > sizes.md
          echo "" >> sizes.md
          echo "| File | Size |" >> sizes.md
          echo "|------|------|" >> sizes.md
          for file in *.wasm *.js; do
            if [ -f "$file" ]; then
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "| $file | $size |" >> sizes.md
            fi
          done

      - name: Upload artifacts (${{ matrix.build_type }})
        uses: actions/upload-artifact@v4
        with:
          name: chdb-wasm-${{ matrix.build_type }}-${{ github.sha }}
          path: artifacts/${{ matrix.build_type }}
          retention-days: 30

  # ============================================================================
  # Test Jobs
  # ============================================================================
  test:
    name: Test WASM Build
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: chdb-wasm-Release-${{ github.sha }}
          path: dist/Release

      - name: Install test dependencies
        run: |
          cd packages/chdb-wasm
          npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run WASM validation tests
        run: |
          cd packages/chdb-wasm

          # Create a simple validation script
          cat > validate-wasm.mjs << 'EOF'
          import { readFile } from 'fs/promises';
          import { fileURLToPath } from 'url';
          import { dirname, join } from 'path';

          const __dirname = dirname(fileURLToPath(import.meta.url));

          async function validateWasm(wasmPath) {
            try {
              const wasmBuffer = await readFile(wasmPath);

              // Validate WASM magic number
              const magic = new Uint8Array(wasmBuffer.slice(0, 4));
              const expectedMagic = new Uint8Array([0x00, 0x61, 0x73, 0x6d]); // \0asm

              if (magic.every((byte, i) => byte === expectedMagic[i])) {
                console.log(`✓ Valid WASM file: ${wasmPath}`);
                console.log(`  Size: ${(wasmBuffer.length / 1024 / 1024).toFixed(2)} MB`);
                return true;
              } else {
                console.error(`✗ Invalid WASM magic number in: ${wasmPath}`);
                return false;
              }
            } catch (error) {
              console.error(`✗ Error reading ${wasmPath}: ${error.message}`);
              return false;
            }
          }

          // Validate all WASM files in dist
          const distDir = join(__dirname, '../../dist/Release');
          const fs = await import('fs');

          if (fs.existsSync(distDir)) {
            const files = fs.readdirSync(distDir).filter(f => f.endsWith('.wasm'));

            if (files.length === 0) {
              console.log('No WASM files found to validate (build may have produced only JS)');
              process.exit(0);
            }

            let allValid = true;
            for (const file of files) {
              const valid = await validateWasm(join(distDir, file));
              allValid = allValid && valid;
            }

            process.exit(allValid ? 0 : 1);
          } else {
            console.log('No dist directory found - skipping validation');
            process.exit(0);
          }
          EOF

          node validate-wasm.mjs

      - name: Run Node.js smoke tests
        run: |
          cd packages/chdb-wasm

          # Create a smoke test
          cat > smoke-test.mjs << 'EOF'
          import { readFile } from 'fs/promises';
          import { fileURLToPath } from 'url';
          import { dirname, join } from 'path';

          const __dirname = dirname(fileURLToPath(import.meta.url));

          async function smokeTest() {
            console.log('Running WASM smoke tests...');

            // Check if JS wrapper exists and is valid JavaScript
            const distDir = join(__dirname, '../../dist/Release');
            const fs = await import('fs');

            if (!fs.existsSync(distDir)) {
              console.log('No dist directory - skipping smoke tests');
              return;
            }

            const jsFiles = fs.readdirSync(distDir).filter(f => f.endsWith('.js'));

            for (const jsFile of jsFiles) {
              const jsPath = join(distDir, jsFile);
              const content = await readFile(jsPath, 'utf-8');

              // Basic syntax validation
              try {
                new Function(content);
                console.log(`✓ Valid JavaScript syntax: ${jsFile}`);
              } catch (error) {
                // Module syntax won't work with Function, try to detect ES6 modules
                if (content.includes('export') || content.includes('import')) {
                  console.log(`✓ ES6 module detected: ${jsFile}`);
                } else {
                  console.error(`✗ JavaScript error in ${jsFile}: ${error.message}`);
                  process.exit(1);
                }
              }
            }

            console.log('Smoke tests passed!');
          }

          smokeTest().catch(err => {
            console.error('Smoke test failed:', err);
            process.exit(1);
          });
          EOF

          node smoke-test.mjs

  # ============================================================================
  # Size Report Job
  # ============================================================================
  size-report:
    name: Generate Size Report
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate size comparison report
        run: |
          echo "# WASM Build Size Report" > size-report.md
          echo "" >> size-report.md
          echo "**Commit:** ${{ github.sha }}" >> size-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> size-report.md
          echo "**Date:** $(date -u)" >> size-report.md
          echo "" >> size-report.md

          for profile_dir in artifacts/chdb-wasm-*; do
            if [ -d "$profile_dir" ]; then
              profile_name=$(basename "$profile_dir" | sed 's/chdb-wasm-//' | sed "s/-${{ github.sha }}//")
              echo "## $profile_name" >> size-report.md
              echo "" >> size-report.md

              if [ -f "$profile_dir/sizes.md" ]; then
                cat "$profile_dir/sizes.md" >> size-report.md
              else
                echo "| File | Size |" >> size-report.md
                echo "|------|------|" >> size-report.md
                for file in "$profile_dir"/*.wasm "$profile_dir"/*.js; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    size=$(ls -lh "$file" | awk '{print $5}')
                    echo "| $filename | $size |" >> size-report.md
                  fi
                done
              fi
              echo "" >> size-report.md
            fi
          done

          cat size-report.md

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ github.sha }}
          path: size-report.md
          retention-days: 30

      - name: Post size report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('size-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  # ============================================================================
  # Release Job (only on main branch)
  # ============================================================================
  release:
    name: Create Release Artifacts
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: chdb-wasm-Release-${{ github.sha }}
          path: release

      - name: Download MinSizeRel artifact
        uses: actions/download-artifact@v4
        with:
          name: chdb-wasm-MinSizeRel-${{ github.sha }}
          path: release-min

      - name: Package release bundle
        run: |
          mkdir -p bundle

          # Standard release (balanced size/performance)
          cp -r release bundle/standard
          tar -czvf chdb-wasm-standard.tar.gz -C bundle/standard .

          # Minimal release (smallest size)
          cp -r release-min bundle/minimal
          tar -czvf chdb-wasm-minimal.tar.gz -C bundle/minimal .

          # Create combined bundle
          mkdir -p bundle/combined
          cp -r release/* bundle/combined/
          mkdir -p bundle/combined/minimal
          cp -r release-min/* bundle/combined/minimal/
          tar -czvf chdb-wasm-all.tar.gz -C bundle/combined .

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: chdb-wasm-release-bundle-${{ github.sha }}
          path: |
            chdb-wasm-standard.tar.gz
            chdb-wasm-minimal.tar.gz
            chdb-wasm-all.tar.gz
          retention-days: 90
