version: '3.8'

services:
  clickhouse:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dot-do/clickhouse:latest
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    environment:
      # S3/R2 Storage Configuration
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-clickhouse-data}
      S3_REGION: ${S3_REGION:-auto}
      # Performance tuning
      CACHE_SIZE: ${CACHE_SIZE:-10G}
      MAX_MEMORY: ${MAX_MEMORY:-4G}
      MAX_THREADS: ${MAX_THREADS:-4}
    volumes:
      # Persistent cache for better performance across restarts
      - clickhouse-cache:/var/lib/clickhouse/disks/cache
      # S3 metadata storage
      - clickhouse-s3-metadata:/var/lib/clickhouse/disks/s3
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-cache:
    driver: local
  clickhouse-s3-metadata:
    driver: local
