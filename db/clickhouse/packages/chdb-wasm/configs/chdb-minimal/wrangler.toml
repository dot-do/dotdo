# chdb-minimal Worker Configuration
# Minimal SQL engine with in-memory tables and aggregates
#
# Modules included:
# - Core executor WASM (132KB)
# - Memory engine WASM (162KB)
# - Aggregates WASM (153KB)
# Total: ~450KB uncompressed, ~200KB gzipped
#
# Deploy with: wrangler deploy -c packages/chdb-wasm/configs/chdb-minimal/wrangler.toml

name = "chdb-minimal"
main = "worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account
account_id = "b6641681fe423910342b9ffa1364c76d"

[vars]
# Version information
CHDB_MINIMAL_VERSION = "0.1.0"
ENVIRONMENT = "production"

# Development configuration
[dev]
port = 8790
local_protocol = "http"

# Build configuration
[build]
command = ""

# Observability
[observability]
enabled = true

# Rules for WASM module handling
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

# Staging environment
[env.staging]
name = "chdb-minimal-staging"
vars = { ENVIRONMENT = "staging" }
