# chdb-fetch Worker Configuration
# SQL interface for querying HTTP APIs with ClickHouse syntax
#
# Target: 8-12MB WASM combining:
# - Core executor WASM
# - URL table function
# - JSON format parser
# - CSV format parser
# - Aggregates module
#
# Deploy with: wrangler deploy -c configs/chdb-fetch/wrangler.toml

name = "chdb-fetch"
main = "worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account
account_id = "b6641681fe423910342b9ffa1364c76d"

[vars]
# Version information
CHDB_FETCH_VERSION = "0.1.0"
ENVIRONMENT = "production"

# Default cache TTL in seconds (1 hour)
DEFAULT_CACHE_TTL = "3600"

# Maximum response size from URL fetches (10MB)
MAX_RESPONSE_SIZE = "10485760"

# Request timeout in milliseconds (30 seconds)
FETCH_TIMEOUT = "30000"

# R2 bucket for WASM module storage
# The chdb-fetch WASM module (~8-12MB) will be stored here
[[r2_buckets]]
bucket_name = "chdb-wasm"
binding = "WASM_BUCKET"

# Development configuration
[dev]
port = 8789
local_protocol = "http"

# Build configuration
[build]
command = ""

# Observability
[observability]
enabled = true

# Rules for WASM module handling
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Production environment
[env.production]
vars = { ENVIRONMENT = "production", DEFAULT_CACHE_TTL = "3600" }

# Staging environment
[env.staging]
name = "chdb-fetch-staging"
vars = { ENVIRONMENT = "staging", DEFAULT_CACHE_TTL = "60" }
