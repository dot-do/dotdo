# chDB Lake Worker - SQL Queries over R2 Parquet Files
#
# Target: 15-20MB WASM for data lake queries
# Features:
# - Core executor WASM
# - S3/R2 table function
# - Parquet reader
# - JSON/CSV formats
# - Aggregates module
#
# Deploy with: wrangler deploy -c configs/chdb-lake/wrangler.toml

name = "chdb-lake"
main = "./worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Paid plan required for 128MB memory
account_id = "b6641681fe423910342b9ffa1364c76d"

[vars]
# Environment variables (non-sensitive)
CHDB_LAKE_VERSION = "0.1.0"
ENVIRONMENT = "production"
# Maximum query execution time in milliseconds
MAX_QUERY_TIME_MS = "30000"
# Maximum result size in bytes (10MB)
MAX_RESULT_SIZE = "10485760"
# Enable query result caching (disabled - no KV binding configured)
ENABLE_CACHE = "false"
# Cache TTL in seconds (5 minutes)
CACHE_TTL = "300"
# DEBUG = "true"  # Uncomment for debug logging

# R2 bucket for data storage (Parquet files, CSV, JSON)
[[r2_buckets]]
bucket_name = "chdb-data"
binding = "DATA_BUCKET"

# R2 bucket for WASM modules storage
[[r2_buckets]]
bucket_name = "chdb-wasm"
binding = "WASM_BUCKET"

# Durable Object for MergeTree VFS metadata coordination
# Handles: table schemas, part registry, mutation log, write locks
[durable_objects]
bindings = [
  { name = "MERGETREE_DO", class_name = "MergeTreeDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["MergeTreeDO"]

# NOTE: We use Cloudflare Cache API instead of KV for query result caching
# Cache API is FREE and supports responses up to 512MB (5GB on enterprise zones)
# KV costs money and has a 25MB per value limit

# Development configuration
[dev]
port = 8789
local_protocol = "http"
# Local persistence is configured via wrangler commands:
# wrangler dev --persist-to .wrangler/state

# Build configuration (TypeScript is handled by wrangler)
[build]
command = ""

# Observability
[observability]
enabled = true

# Rules for WASM module handling
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Limits for data lake operations
[limits]
cpu_ms = 30000  # 30 second CPU time limit

# Triggers (optional: scheduled cache cleanup)
# [[triggers]]
# crons = ["0 * * * *"]  # Every hour, cleanup expired cache entries
