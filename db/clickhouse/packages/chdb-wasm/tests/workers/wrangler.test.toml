# Test-specific wrangler configuration for Workers runtime tests
# This config is simpler and doesn't require external assets

name = "chdb-wasm-workers-test"
main = "../../src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CHDB_VERSION = "0.1.0"
ENVIRONMENT = "test"

# Development configuration
[dev]
port = 0  # Use random port
local_protocol = "http"

# Build configuration (TypeScript is handled by wrangler)
[build]
command = ""

# WASM module bundling rules
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# Observability disabled for tests
[observability]
enabled = false
