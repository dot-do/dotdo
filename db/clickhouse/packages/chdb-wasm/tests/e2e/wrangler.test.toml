# Test-specific wrangler configuration for E2E tests
# This config supports dynamic WASM loading tests without requiring actual WASM files
# (tests run in mock mode)

name = "chdb-wasm-test"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CHDB_VERSION = "0.1.0"
ENVIRONMENT = "test"
CHDB_PROFILE = "dashboard"

# Note: Assets are not configured for test config as we use mock mode
# For tests that need real assets, use the main wrangler.toml

# Development configuration
[dev]
port = 0  # Use random port
local_protocol = "http"

# Build configuration (TypeScript is handled by wrangler)
[build]
command = ""

# WASM module bundling rules
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# Observability disabled for tests
[observability]
enabled = false
