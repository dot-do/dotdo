# Executor Worker - Minimal SQL Expression Evaluator (132KB WASM)
#
# This is a separate worker configuration for the minimal executor WASM module.
# Deploy with: wrangler deploy -c wrangler-executor.toml

name = "chdb-executor"
main = "src/executor-worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account
account_id = "b6641681fe423910342b9ffa1364c76d"

[vars]
EXECUTOR_VERSION = "0.1.0"
ENVIRONMENT = "production"

# Development configuration
[dev]
port = 8788
local_protocol = "http"

# Build configuration
[build]
command = ""

# Observability
[observability]
enabled = true

# Rules for WASM module handling
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false
