name = "chdb-wasm"
# chdb (ClickHouse) compiled to WebAssembly
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Paid plan required for 128MB memory
account_id = "b6641681fe423910342b9ffa1364c76d"

[vars]
# Environment variables (non-sensitive)
CHDB_VERSION = "0.1.0"
ENVIRONMENT = "production"
# DEBUG = "true"  # Uncomment for debug logging

# WASM Build Profile Selection
# Available profiles (see docs/BUILD_PROFILES.md):
#   parser     - ~300KB   - SQL validation, IDE integration
#   dashboard  - ~3MB     - Simple dashboards, small data
#   analytics  - ~8MB     - ClickBench-style analytics
#   etl        - ~12-15MB - Data transformation (Parquet/Arrow)
#   lakehouse  - ~18-20MB - Query S3/R2 data lakes directly
#   full       - ~25MB+   - Maximum ClickHouse compatibility
CHDB_PROFILE = "dashboard"

# Static Assets configuration - serves WASM files separately from the Worker bundle
# chdb WASM is ~124MB, needs to be served via Static Assets or R2
[assets]
directory = "./public"
binding = "ASSETS"

# Development configuration
[dev]
port = 8787
local_protocol = "http"

# Build configuration (TypeScript is handled by wrangler)
[build]
command = ""

# WASM module bundling rules
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# R2 Storage Bindings
# ClickBench dataset bucket for analytical benchmarks
[[r2_buckets]]
binding = "CLICKBENCH_BUCKET"
bucket_name = "clickbench-data"

# Optional: Preview bucket for development
[[r2_buckets]]
binding = "CLICKBENCH_BUCKET_PREVIEW"
bucket_name = "clickbench-data-preview"
preview_bucket_name = "clickbench-data-preview"

# Document DB storage bucket (MongoDB/Firebase compatibility layer)
# Used for hybrid storage mode - large collections and historical data
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "chdb-document-data"

# WASM module storage bucket for streaming WASM from R2
# Used by StreamingWasmLoader to load chdb WASM modules
[[r2_buckets]]
binding = "WASM_BUCKET"
bucket_name = "chdb-wasm-modules"

# Durable Objects Bindings
# Memory Engine DO - for in-memory tables with persistence
[[durable_objects.bindings]]
name = "MEMORY_ENGINE_DO"
class_name = "MemoryEngineDO"

# MergeTree DO - for MergeTree table metadata and part management
[[durable_objects.bindings]]
name = "MERGETREE_DO"
class_name = "MergeTreeDO"

# Document DB DO - for document database operations (MongoDB/Firebase compat)
# Handles: collections, documents, indexes, subscriptions
[[durable_objects.bindings]]
name = "DOCUMENT_DB_DO"
class_name = "DocumentDBDO"

# DO migrations - required for Durable Object classes
[[migrations]]
tag = "v1"
new_classes = ["MemoryEngineDO", "MergeTreeDO", "DocumentDBDO"]

# Observability
[observability]
enabled = true

# Production environment (default)
[env.production]
vars = { ENVIRONMENT = "production", CHDB_VERSION = "0.1.0", CHDB_PROFILE = "dashboard" }

[[env.production.r2_buckets]]
binding = "CLICKBENCH_BUCKET"
bucket_name = "clickbench-data"

[[env.production.r2_buckets]]
binding = "CLICKBENCH_BUCKET_PREVIEW"
bucket_name = "clickbench-data-preview"
preview_bucket_name = "clickbench-data-preview"

[[env.production.r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "chdb-document-data"

[[env.production.r2_buckets]]
binding = "WASM_BUCKET"
bucket_name = "chdb-wasm-modules"

[[env.production.durable_objects.bindings]]
name = "MEMORY_ENGINE_DO"
class_name = "MemoryEngineDO"

[[env.production.durable_objects.bindings]]
name = "MERGETREE_DO"
class_name = "MergeTreeDO"

[[env.production.durable_objects.bindings]]
name = "DOCUMENT_DB_DO"
class_name = "DocumentDBDO"

# Staging environment for E2E testing
[env.staging]
name = "chdb-wasm-staging"
vars = { ENVIRONMENT = "staging", CHDB_VERSION = "0.1.0", CHDB_PROFILE = "dashboard" }

[[env.staging.r2_buckets]]
binding = "CLICKBENCH_BUCKET"
bucket_name = "clickbench-data"

[[env.staging.r2_buckets]]
binding = "CLICKBENCH_BUCKET_PREVIEW"
bucket_name = "clickbench-data-preview"
preview_bucket_name = "clickbench-data-preview"

[[env.staging.r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "chdb-document-data-staging"

[[env.staging.r2_buckets]]
binding = "WASM_BUCKET"
bucket_name = "chdb-wasm-modules-staging"

[[env.staging.durable_objects.bindings]]
name = "MEMORY_ENGINE_DO"
class_name = "MemoryEngineDO"

[[env.staging.durable_objects.bindings]]
name = "MERGETREE_DO"
class_name = "MergeTreeDO"

[[env.staging.durable_objects.bindings]]
name = "DOCUMENT_DB_DO"
class_name = "DocumentDBDO"
