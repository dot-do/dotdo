# scheduled-deploy.yml
# GitHub Actions workflow for scheduled deployments
#
# Use cases:
#   - Nightly deployments to staging
#   - Weekly production deployments
#   - Automatic dependency updates and redeploy
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN: API token with Workers deployment permissions
#   - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID

name: Scheduled Deployment

on:
  schedule:
    # Run every day at 2 AM UTC (adjust as needed)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_tests:
        description: 'Run tests before deployment'
        required: true
        default: true
        type: boolean

env:
  NODE_VERSION: '22'

jobs:
  # Check if there are new commits to deploy
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comparison

      - name: Check for recent commits
        id: check
        run: |
          # Get commits in the last 24 hours
          HOURS=24
          SINCE=$(date -d "$HOURS hours ago" --utc +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_COUNT=$(git log --since="$SINCE" --oneline | wc -l)

          echo "Commits in last $HOURS hours: $COMMIT_COUNT"

          if [[ "$COMMIT_COUNT" -gt 0 ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "No new commits, skipping deployment"
          fi

  # Run tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && (github.event.inputs.run_tests != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  # Deploy
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [check-changes, test]
    if: |
      always() &&
      needs.check-changes.outputs.should_deploy == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment || 'staging' }}

      - name: Deployment notification
        run: |
          echo "## Scheduled Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

  # Notify on failure
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Create failure summary
        run: |
          echo "## Scheduled Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The scheduled deployment has failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

      # Optional: Send notification to Slack, Discord, email, etc.
      # - name: Send Slack notification
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     payload: |
      #       {
      #         "text": "Scheduled deployment failed for ${{ github.repository }}"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
