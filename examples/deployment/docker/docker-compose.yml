# docker-compose.yml
# Local development environment for dotdo applications
#
# Services:
#   - app: Main dotdo application running in wrangler dev
#   - test: Test runner for continuous testing
#
# Usage:
#   docker-compose up          # Start development server
#   docker-compose up -d       # Start in background
#   docker-compose run test    # Run tests once
#   docker-compose logs -f     # View logs
#   docker-compose down        # Stop all services

version: '3.8'

services:
  # Main development server
  app:
    build:
      context: ../../..
      dockerfile: examples/deployment/docker/Dockerfile.dev
    ports:
      - "8787:8787"
    volumes:
      # Mount source code for hot reloading
      - ../../../:/app
      # Prevent overwriting node_modules
      - /app/node_modules
      # Persist wrangler state between restarts
      - wrangler-state:/app/.wrangler
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Test runner service
  test:
    build:
      context: ../../..
      dockerfile: examples/deployment/docker/Dockerfile.dev
    volumes:
      - ../../../:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
    command: ["npm", "run", "test:run"]
    profiles:
      - testing

  # Type checking service
  typecheck:
    build:
      context: ../../..
      dockerfile: examples/deployment/docker/Dockerfile.dev
    volumes:
      - ../../../:/app
      - /app/node_modules
    command: ["npm", "run", "typecheck"]
    profiles:
      - ci

  # Linting service
  lint:
    build:
      context: ../../..
      dockerfile: examples/deployment/docker/Dockerfile.dev
    volumes:
      - ../../../:/app
      - /app/node_modules
    command: ["npm", "run", "lint"]
    profiles:
      - ci

volumes:
  wrangler-state:
    driver: local

networks:
  default:
    name: dotdo-dev
