# secret.yaml
# Kubernetes Secret template for dotdo deployment credentials
#
# IMPORTANT: This is a template. DO NOT commit actual secrets to version control.
#
# Usage:
#   1. Copy this file and fill in your actual values
#   2. Base64 encode your values: echo -n 'your-value' | base64
#   3. Apply: kubectl apply -f secret.yaml
#
# Alternative: Use kubectl to create secrets directly:
#   kubectl create secret generic dotdo-secrets \
#     --from-literal=cloudflare-api-token=your-token \
#     --from-literal=cloudflare-account-id=your-account-id \
#     --from-literal=git-repo-url=https://github.com/your-org/your-repo.git

apiVersion: v1
kind: Secret
metadata:
  name: dotdo-secrets
  namespace: default
  labels:
    app: dotdo
    component: secrets
type: Opaque
data:
  # Cloudflare API Token with Workers deployment permissions
  # Create at: https://dash.cloudflare.com/profile/api-tokens
  # Required permissions: Workers Scripts:Edit, Workers KV Storage:Edit, Workers R2 Storage:Edit
  # Base64 encoded value
  cloudflare-api-token: <BASE64_ENCODED_CLOUDFLARE_API_TOKEN>

  # Cloudflare Account ID (optional if specified in wrangler.toml)
  # Find at: https://dash.cloudflare.com -> Overview -> Account ID
  cloudflare-account-id: <BASE64_ENCODED_ACCOUNT_ID>

  # Git repository URL for cloning
  # For private repos, use: https://oauth2:<token>@github.com/org/repo.git
  git-repo-url: <BASE64_ENCODED_GIT_REPO_URL>

---
# Example: How to create secrets using kubectl
# kubectl create secret generic dotdo-secrets \
#   --from-literal=cloudflare-api-token=your-cloudflare-api-token \
#   --from-literal=cloudflare-account-id=your-account-id \
#   --from-literal=git-repo-url=https://github.com/dotdo/dotdo.git \
#   --dry-run=client -o yaml > secret-generated.yaml

---
