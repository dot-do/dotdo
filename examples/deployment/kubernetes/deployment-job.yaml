# deployment-job.yaml
# Kubernetes Job for deploying dotdo to Cloudflare Workers
#
# This job runs the wrangler deploy command in a container.
# Use this for CI/CD orchestration in Kubernetes environments.
#
# Usage:
#   kubectl apply -f secret.yaml
#   kubectl apply -f deployment-job.yaml
#   kubectl logs -f job/dotdo-deploy

apiVersion: batch/v1
kind: Job
metadata:
  name: dotdo-deploy
  namespace: default
  labels:
    app: dotdo
    component: deployment
spec:
  # Allow manual retries
  backoffLimit: 3
  # Clean up completed jobs after 1 hour
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: dotdo
        component: deployment
    spec:
      restartPolicy: Never
      containers:
        - name: deployer
          image: node:22-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing dependencies..."
              npm install -g wrangler@latest
              npm ci --ignore-scripts

              echo "Building application..."
              npm run build

              echo "Deploying to Cloudflare Workers..."
              npx wrangler deploy --env ${DEPLOY_ENV:-production}

              echo "Deployment complete!"
          env:
            # Cloudflare API token for deployment
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dotdo-secrets
                  key: cloudflare-api-token
            # Account ID (optional, can be in wrangler.toml)
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: dotdo-secrets
                  key: cloudflare-account-id
                  optional: true
            # Deployment environment
            - name: DEPLOY_ENV
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: source-code
              mountPath: /app
      # Init container to clone the repository
      initContainers:
        - name: clone-repo
          image: alpine/git:latest
          command:
            - /bin/sh
            - -c
            - |
              git clone --depth 1 --branch ${GIT_BRANCH:-main} ${GIT_REPO_URL} /app
          env:
            - name: GIT_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: dotdo-secrets
                  key: git-repo-url
            - name: GIT_BRANCH
              value: "main"
          volumeMounts:
            - name: source-code
              mountPath: /app
      volumes:
        - name: source-code
          emptyDir: {}
---
# ServiceAccount for deployment jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dotdo-deployer
  namespace: default
  labels:
    app: dotdo
